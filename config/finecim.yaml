# FINeCIM (www.finecim.cz) taxonomy and mapping, captured from a logged-in session on 2026-11-05.
# Numeric ids are FINeCIM's own. Segment slugs are the <slug> in /cz/domena/<slug>/.

base_url: https://www.finecim.cz

# Customer segments used by the "segment" filter (zakaznicky_segment on products)
customer_segments:
  1: FOP a firmy
  6: Fyzické osoby

segments:
  ucty:
    nazev: Účty
    has_products: true
    product_lines: {1: Běžné účty, 2: Debetní karty, 53: Mobilní aplikace}
  sporeni:
    nazev: Spoření
    has_products: true
    product_lines: {13: Spořicí účty, 14: Termínované vklady}
  uvery:
    nazev: Úvěry
    has_products: true
    product_lines: {27: Konsolidace, 29: Kontokorenty, 7: Kreditní karty, 28: Mikropůjčky, 23: Nákup na splátky, 3: Úvěry}
  hypoteky:
    nazev: Hypotéky
    has_products: true
    product_lines: {24: Americké hypotéky, 4: Hypotéky}
  investice:
    nazev: Investice
    has_products: true
    product_lines: {50: Investiční fondy, 49: Investiční platformy}
  bankovni-trh:
    nazev: Bankovní trh
    has_products: false
    product_lines: {24: Americké hypotéky, 1: Běžné účty, 2: Debetní karty, 4: Hypotéky, 50: Investiční fondy, 27: Konsolidace, 29: Kontokorenty, 7: Kreditní karty, 13: Spořicí účty, 14: Termínované vklady, 3: Úvěry}
  fintech:
    nazev: FinTech
    has_products: false
    product_lines: {24: Americké hypotéky, 1: Běžné účty, 2: Debetní karty, 4: Hypotéky, 50: Investiční fondy, 49: Investiční platformy, 23: Nákup na splátky, 48: Penzijní spoření, 13: Spořicí účty, 14: Termínované vklady, 3: Úvěry}
  bankopojisteni:
    nazev: Bankopojištění
    has_products: true
    product_lines: {60: Cestovní pojištění - dlouhodobé, 61: Cestovní pojištění - krátkodobé, 58: Pojištění schopnosti splácet ke kreditním kartám, 56: Pojištění schopnosti splácet k hypotékám, 57: Pojištění schopnosti splácet k půjčkám}
  stavebni-sporitelny:
    nazev: Stavební spořitelny
    has_products: true
    product_lines: {15: Překlenovací úvěry, 5: Stavební spoření, 16: Úvěry ze stavebního spoření}
  penzijni-spolecnosti:
    nazev: Penzijní společnosti
    has_products: true
    product_lines: {48: Penzijní spoření}

# FINeCIM subject id -> competitor id in config/competitors/ (the 19 configured banks).
