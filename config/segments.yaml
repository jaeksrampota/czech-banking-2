# Segmenty trhu a produktové linie, sladěné s doménami FINeCIM (/cz/domena/<finecim_slug>/).
# finecim_id = id produktové linie na FINeCIM (viz config/finecim.yaml). Linie bez finecim_id
# jsou vlastní (nemají protějšek v dané doméně FINeCIM).
segmenty:
