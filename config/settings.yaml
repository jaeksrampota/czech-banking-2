database:
  path: "data/db/ci_monitor.sqlite"

collectors:
  ares:
    schedule: "weekly"
  job_postings:
    schedule: "daily"
  news:
    schedule: "hourly"
  website:
    schedule: "daily"

logging:
  level: "INFO"
  file: "data/ci_monitor.log"

finecim:
  rate_limit_seconds: 1.5
  cookie_path: "data/finecim_cookies.json"
  schedule: "daily"
